<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Raposa barista — animações</title>
<style>body{font:18px system-ui;background:#2c201c;color:#fff0d2;margin:30px}h1{color:#f9cf77}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}figure{margin:0;text-align:center;padding:18px;background:#634a3c;border-radius:10px}img{width:180px;height:180px;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#c5b7a0 0% 25%,#dacdb8 0% 50%) 0/24px 24px}button{padding:10px;font:inherit}</style>
<h1>Raposa barista — movimentos</h1><p>18 animações integradas ao Godot. Braços, pernas e cauda animados quadro a quadro.</p><button id="toggle">Pausar</button><main id="grid"></main>
<script>
const animations=[];for(const d of ['baixo','esquerda','direita','cima']){animations.push(['parada_'+d,1,1],['andar_'+d,4,8],['segurar_'+d,1,1],['carregar_'+d,4,7])}animations.push(['preparar',4,7],['entregar',4,8]);let paused=false;let t=0,last=performance.now();const views=[];for(const [name,count,fps] of animations){const f=document.createElement('figure');const im=document.createElement('img');im.src=name+'_00.png';const c=document.createElement('figcaption');c.textContent=name.replaceAll('_',' ');f.append(im,c);grid.append(f);views.push({im,name,count,fps})}toggle.onclick=()=>{paused=!paused;toggle.textContent=paused?'Continuar':'Pausar'};function tick(now){if(!paused)t+=(now-last)/1000;last=now;for(const v of views){const frame=Math.floor(t*v.fps)%v.count;const src=v.name+'_'+String(frame).padStart(2,'0')+'.png';if(v.im.getAttribute('src')!==src)v.im.src=src}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
