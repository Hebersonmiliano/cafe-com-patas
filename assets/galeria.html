<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Sprites — Café com Patas</title>
<style>body{margin:32px;background:#2c201c;color:#fff0d2;font:16px system-ui}h1{color:#f9cf77}section{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}figure{margin:0;background:#654b3c;padding:12px;border-radius:8px;text-align:center}img{width:140px;height:140px;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#c5b7a0 0% 25%,#d9cbb5 0% 50%) 0/20px 20px}figcaption{margin-top:8px}a{color:#fff0d2}</style>
<h1>Café com Patas — 54 sprites</h1><p>Arte baseada na referência aprovada. Personagens em pose estática. Clique em um sprite para abrir seu PNG.</p><main id="gallery"></main>
<script>
const groups={personagens:['gato','coelho','capivara','raposa'],objetos:['balcao','vitrine','cafeteira','moedor','geladeira','caixa','mesa_toalha','mesa','cadeira','tapete_vermelho','tapete_verde','portao','planta_grande','planta_pendente','flores','planta_pequena','luminaria','estante','placa','lousa','quadro','prateleira','redoma','pote_graos','pote','garrafa_leite','bilhetes','xicaras','jarra','prato'],produtos_ui:['cafe','bolo','suco','morango','graos','leite','croissant','muffin','cupcake_rosa','cupcake_branco','cookie','torta','moeda','coracao','coracao_vazio','balao'],texturas:['piso','madeira_parede','madeira_balcao','parede_creme']};
for(const [group,names] of Object.entries(groups)){const h=document.createElement('h2');h.textContent=group.replaceAll('_',' ');gallery.append(h);const section=document.createElement('section');gallery.append(section);for(const name of names){const fig=document.createElement('figure');const a=document.createElement('a');a.href=group+'/'+name+'.png';const img=document.createElement('img');img.src=a.href;img.alt=name;img.loading='lazy';a.append(img);const cap=document.createElement('figcaption');cap.textContent=name.replaceAll('_',' ');fig.append(a,cap);section.append(fig)}}
</script></html>
